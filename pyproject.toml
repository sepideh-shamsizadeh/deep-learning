
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minidl"
version = "0.1.0"
description = "A lightweight deep learning framework built from scratch using Python and NumPy."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["minidl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
